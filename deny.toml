[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2024-0436: `paste` is unmaintained. It is not a vulnerability and it is
# not reachable from anything this repository ships: it arrives through
# `faer`/`gemm`/`nalgebra`, which are dev-dependencies of `uor-matmul-validate`
# and exist only to be compared against (R11). cargo-deny reports "No safe upgrade
# is available", because the fix would have to land in those crates. The shipped
# crates depend on none of them, which `just no-alloc` witnesses by building them
# for a target with no allocator at all.
ignore = [
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0110: `bare-metal` is deprecated. It is not a vulnerability,
    # and it arrives only through `cortex-m-semihosting`, a dependency of the
    # executor --- CI infrastructure that no shipped crate depends on, which
    # `just no-alloc` witnesses by building the shipped crates without it.
    "RUSTSEC-2026-0110",
]

[licenses]
version = 2
# Exactly the licences the graph carries, and no more. `ISC` and `BSD-3-Clause`
# used to be here and nothing used either, which cargo-deny reports as
# `license-not-encountered` on every run --- a standing warning that makes the
# list a wish rather than a description, and that trains a reader to skip past
# the place a real warning would appear. `cargo deny list` is what says which
# five these are.
#
# A dependency arriving under a licence not below now fails this gate. That is
# the point: it is a decision a reviewer makes at the time, not one a
# pre-granted allowance made for them in advance.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "BSD-2-Clause", "Zlib"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

# R11: oracle crates are dev-dependencies of uor-matmul-validate only. The
# shipped crates depend on none of them.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

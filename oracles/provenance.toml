# oracles/provenance.toml --- R11.
#
# Every external claim is bound to a committed artifact, with provenance. An
# external claim with no provenance is an assertion, not a validation.
#
# The resolved versions live in `Cargo.lock`, which is committed, because the
# version of an oracle is part of the claim made against it.
#
# Every `harness` below names a function that exists, and
# `tests/provenance.rs::the_recorded_harness_names_resolve` is what says so.
# Four of them did not: `xtask verify-oracles` substring-matches the *id* and
# reads no other field, and the register's ID-to-test rule matches by name
# suffix, so a record could point at nothing while both gates stayed green. A
# provenance record whose harness cannot be found is a citation to a missing
# paper.

spec = "uor-matmul/1"

[[record]]
id = "CX-01"
oracle = "ndarray"
kind = "crate"
entry = "Array2::dot"
harness = "crates/uor-matmul-validate/tests/cross_library.rs::ndarray_i32_is_byte_identical_cx_01"
version_pin = "Cargo.lock"
exactness = "exact"
status = "reproduced"
note = """i32 satisfies LinalgScalar and ndarray dispatches integer types to its
own generic kernel rather than to matrixmultiply, which is what makes this an
independent witness for the integer path. Verified at implementation time."""


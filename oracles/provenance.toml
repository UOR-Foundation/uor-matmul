# oracles/provenance.toml --- R11.
#
# Every external claim is bound to a committed artifact, with provenance. An
# external claim with no provenance is an assertion, not a validation.
#
# The resolved versions live in `Cargo.lock`, which is committed, because the
# version of an oracle is part of the claim made against it.

spec = "uor-matmul/1"

[[record]]
id = "CX-01"
oracle = "ndarray"
kind = "crate"
entry = "Array2::dot"
harness = "crates/uor-matmul-validate/tests/cross_library.rs::ndarray_i32_agrees_cx_01"
version_pin = "Cargo.lock"
exactness = "exact"
status = "reproduced"
note = """i32 satisfies LinalgScalar and ndarray dispatches integer types to its
own generic kernel rather than to matrixmultiply, which is what makes this an
independent witness for the integer path. Verified at implementation time."""

[[record]]
id = "CX-02"
oracle = "nalgebra"
kind = "crate"
entry = "DMatrix<i32> multiplication"
harness = "crates/uor-matmul-validate/tests/cross_library.rs::nalgebra_i32_agrees_cx_02"
version_pin = "Cargo.lock"
exactness = "exact"
status = "reproduced"

[[record]]
id = "CX-03"
oracle = "ndarray"
kind = "crate"
entry = "Array2::dot over widened i8"
harness = "crates/uor-matmul-validate/tests/cross_library.rs::ndarray_widened_i8_agrees_with_our_i8_kernel_cx_03"
version_pin = "Cargo.lock"
exactness = "exact"
status = "reproduced"
note = "the load-bearing W8A8 external check: our side never widens to i32 at all"

[[record]]
id = "CX-04"
oracle = "nalgebra"
kind = "crate"
entry = "DMatrix<i32> multiplication over decoded i4 weights"
harness = "crates/uor-matmul-validate/tests/cross_library.rs::nalgebra_decoded_weights_agree_with_our_coded_kernel_cx_04"
version_pin = "Cargo.lock"
exactness = "exact"
status = "reproduced"
note = """ties CL-MM01 to an outside witness: the oracle is handed the decoded
weights and we are handed the codes, and the products must be the same bytes."""


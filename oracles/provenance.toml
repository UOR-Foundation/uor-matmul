[[record]]
id = "CX-10"
oracle = "numpy"
kind = "committed artifact"
entry = "numpy.matmul, int64"
harness = "crates/uor-matmul-validate/tests/numpy.rs::numpy_int64_is_byte_identical_cx_10"
version_pin = "oracles/numpy/manifest.json"
exactness = "exact"
status = "reproduced"
generator = "oracles/numpy/generate.py"
note = """Out of process and outside the Rust ecosystem entirely, which is the
point: every other oracle here shares a language, a compiler, and sometimes a
kernel author with this library, so agreement among them is weaker evidence
than it looks. The artifacts are committed with a per-file SHA-256 recorded in
manifest.json, so the claim reproduces without a Python toolchain, and the
harness verifies each digest before believing the bytes."""

[[record]]
id = "CX-11"
oracle = "numpy"
kind = "committed artifact"
entry = "(A[:, :, None] + B[None, :, :]).max(axis=1), int64"
harness = "crates/uor-matmul-validate/tests/tropical_oracle.rs::numpy_max_plus_is_byte_identical_cx_11"
version_pin = "oracles/tropical/manifest.json"
exactness = "exact"
status = "reproduced"
generator = "oracles/tropical/generate.py"
note = """The `(max, +)` half of the operation census, witnessed from outside
the Rust ecosystem exactly as CX-10 witnesses the ring half. A max-plus product
has no rounding for two implementations to disagree about --- `max` selects an
offered value and `+` is exact at this range --- so the comparison is byte
equality with no exempted region, and `exact` here is a stronger word than it
is for a float oracle rather than a weaker one. The semiring zero is spelled
`-2^63` in the artifact and decoded into the element type's own discriminant on
the way in, so no sentinel enters `Trop`. Every case carries masked lanes, in
both operands and in whole rows and columns, because a corpus with no mask
tests half of A-6."""

[[record]]
id = "CK-14"
oracle = "none: a self-describing artifact, not an outside witness"
kind = "committed artifact"
entry = "dequantized-8-bit-style f32 weights, <= 256 distinct bit patterns"
harness = "crates/uor-matmul-validate/tests/symbol_corpus.rs::the_committed_symbol_corpus_fits_a_byte"
version_pin = "oracles/symbols/manifest.json"
exactness = "exact"
status = "reproduced"
generator = "oracles/symbols/generate.py"
note = """The realistic case the u8 arena width exists for: an f32 weight
artifact whose values are drawn from at most 256 distinct bit patterns. The
codebook is the distinct patterns in canonical arena order (CK-10); the codes
address it one byte a symbol; the dense spelling is committed beside them, so
the fixture's reference is the artifact itself. Per-file SHA-256 lives in
manifest.json and the harness verifies each digest before believing the
bytes. No quality claim attaches to the codebook (N3): it is an input the
library consumes, and fitting one beyond this trivial case is out of scope."""

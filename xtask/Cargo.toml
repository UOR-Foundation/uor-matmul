[package]
name = "xtask"
description = "Repository gates: check-model, check-constants, audit-limits, audit-purity, audit-deferral, verify-oracles, validate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
uor-matmul-model = { workspace = true }
# The census prints demangled sequence names: a mangled symbol is a name only
# a linker loves, and the artifact is read by people. xtask is CI
# infrastructure, so a dependency here costs a shipped crate nothing.
rustc-demangle = "0.1"

[lints]
workspace = true

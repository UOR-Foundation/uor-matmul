# CT-01, CT-03, CK-06, CT-08, CD-25: totality over unstructured input.
#
# Deep nightly validation. The claim is that no representable input fails, so
# what the fuzzer looks for is a panic --- not a wrong answer, which the
# differential tests cover. Pull requests retain deterministic differential
# tests in `ci`; randomized search does not hold the merge queue open.
#
# `tropical` is the one exception, and deliberately: it runs both witness
# mechanisms on the operands the fuzzer drew and compares their bytes, so a
# disagreement is a crash. `CD-25` quantifies over every shape, and a corpus is
# a list of shapes someone thought of.
#
# Manual runs use the short one-minute budget; the nightly search gets fifteen
# minutes per target.
name: fuzz

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [totality, float_decode, codec_shapes, tropical]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # `@v2` with an explicit `tool:`, not `@cargo-fuzz`. The tool-name tag form
      # resolved to a *version* SHA and the action then installed nothing at all,
      # warning `no tool specified; this could be caused by a dependabot bug where
      # @<tool_name> tags on this action are replaced by @<version> tags`. It is a
      # warning, so the step succeeded, and the failure surfaced one step later as
      # `error: no such command: fuzz` --- which reads like a toolchain problem and
      # is not one. Naming the tool cannot be rewritten into naming nothing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      # As `miri.yml`: the stable pin in `rust-toolchain.toml` outranks the nightly
      # installed above, and `cargo fuzz` reported "no such command: `fuzz`"
      # because it resolved to the pinned stable toolchain, which has no
      # `cargo-fuzz`. `cargo fuzz` also requires nightly to build a target at all.
      # `--target` is not optional here, and the reason is not obvious. `cargo
      # fuzz` defaults its target triple to the triple `cargo-fuzz` itself was
      # built for --- not to the toolchain's host. `install-action` fetches a
      # prebuilt static binary, which is built for musl, so the default became
      # `x86_64-unknown-linux-musl`: a target whose `std` this toolchain does not
      # have, and one a sanitizer cannot use at all.
      #
      #     error: sanitizer is incompatible with statically linked libc
      #     error[E0463]: can't find crate for `std`
      #
      # Building `cargo-fuzz` from source instead would hide this rather than fix
      # it --- it works locally for exactly that reason, which is why the local
      # runs did not catch it --- and would cost a from-scratch compile in every
      # job. Asking `rustc` for the host triple makes the fuzzer follow the
      # toolchain, whatever the tool's own build happens to be.
      - run: >-
          cargo fuzz run --target "$(rustc -vV | sed -n 's/^host: //p')"
          ${{ matrix.target }}
          -- -max_total_time=${{ github.event_name == 'schedule' && 900 || 60 }}
        env:
          RUSTUP_TOOLCHAIN: nightly

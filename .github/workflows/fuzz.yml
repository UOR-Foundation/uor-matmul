# CT-01, CT-03, CK-06: totality over unstructured input.
#
# Short on every push, long on a schedule. The claim is that no representable
# input fails, so what the fuzzer looks for is a panic --- not a wrong answer,
# which the differential tests cover.
name: fuzz

on:
  pull_request:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [totality, float_decode, codec_shapes]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      # As `miri.yml`: the stable pin in `rust-toolchain.toml` outranks the nightly
      # installed above, and `cargo fuzz` reported "no such command: `fuzz`"
      # because it resolved to the pinned stable toolchain, which has no
      # `cargo-fuzz`. `cargo fuzz` also requires nightly to build a target at all.
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event_name == 'schedule' && 900 || 60 }}
        env:
          RUSTUP_TOOLCHAIN: nightly

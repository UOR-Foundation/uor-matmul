# The crate with the `unsafe` in it, under Miri.
#
# `uor-matmul-kernels` holds 298 of the workspace's 305 `unsafe` blocks and
# functions; `uor-matmul` holds the other seven, in the raw-pointer face; the
# remaining three shipped crates hold none and `#![forbid(unsafe_code)]` says so.
# `CU-07` asserts that partition rather than leaving it to this comment.
#
# The kernels' portable module is the one Miri can run: the SIMD modules use
# intrinsics Miri does not model, and under Miri no feature-detection predicate
# answers true, so the portable sequences are what execute. That is the right
# split: the SIMD kernels are validated by differential testing against the
# portable one, and the portable one is validated here.
#
# It did not run that crate. It ran the three that forbid `unsafe`, took longer
# than six hours, and was cancelled at GitHub's ceiling on every push it was ever
# enabled for --- so it checked crates that cannot contain the thing it looks for,
# and never reported. `uor-matmul-gemm` is out for that reason: it forbids
# `unsafe`, and its tests are whole matmuls whose cost under emulation is
# unbounded. `uor-matmul-core` and `-codec` stay, because both do `bytemuck` casts
# and slice arithmetic that provenance checking has something to say about.
#
# `uor-matmul` is here because the facade carries the raw-pointer face (`CS-05`),
# which cannot `forbid(unsafe_code)`: it turns a caller's pointer and four strides
# into slices, and the window it computes for a negative stride is arithmetic no
# type can check. `crates/uor-matmul/tests/raw.rs` hands it buffers that are
# exactly the reachable window, so an off-by-one in either direction is an
# out-of-bounds access here. Measured: a window one element too long passes the
# native run and is Undefined Behaviour under Miri.
#
# `timeout-minutes` is set so that a run which stops finishing *fails*, promptly,
# instead of occupying a runner for six hours and reporting `cancelled` --- which
# reads like an infrastructure hiccup rather than the regression it would be.
# It is 90 because the suite doubled in the pass's last week (the kernels'
# parity walk alone runs past 45 on the shared runner), and a leg-split matrix
# was considered and rejected: the ruleset requires a check named exactly
# `miri`, a matrix renames the checks, and a gate that cannot be asked to
# report is a gate that silently never runs. A hung run still fails here ---
# at 90 minutes, not at six hours.
#
# The `-p` list below is not prose: `CU-07` reads it out of this file and asserts
# that every shipped crate either `#![forbid(unsafe_code)]` or appears here, so
# the partition that makes this workspace sound has no third case. Dropping a
# crate from the list fails that test rather than quietly narrowing the gate,
# which is exactly how the original list went unnoticed.
name: miri

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue runs the required checks on its merge group; without
  # this trigger the group reports nothing and the queue ejects the PR.
  merge_group:
  schedule: [{ cron: "0 4 * * 1" }]

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
      # `RUSTUP_TOOLCHAIN` because `rust-toolchain.toml` pins a stable channel and
      # a pin outranks the toolchain this job just installed --- so `cargo miri`
      # resolved to stable and reported that the `miri` component "is not
      # available for the '1.97.1-x86_64-unknown-linux-gnu' toolchain". The pin is
      # right for every other job; this is the one that needs nightly, and it says
      # so here rather than by removing the pin. `Justfile`'s `fuzz` recipe has
      # always spelled the same thing `cargo +nightly`.
      - run: cargo miri test -p uor-matmul-kernels -p uor-matmul -p uor-matmul-core -p uor-matmul-codec
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
          RUSTUP_TOOLCHAIN: nightly

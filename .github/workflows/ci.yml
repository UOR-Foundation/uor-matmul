# The normative acceptance gate.
#
# `just vv` is the single gate; the other workflows are the axes it cannot run
# on one machine --- other architectures, other targets, longer budgets.
name: ci

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue runs the required checks on its merge group; without
  # this trigger the group reports nothing and the queue ejects the PR.
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  vv:
    name: just vv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - run: just vv

  checked:
    name: CT-02, checked arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The whole corpus with every accumulator operation checked. The width is
      # derived so that overflow is unreachable; this witnesses it rather than
      # guarding it.
      - run: cargo test --workspace --profile checked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  census:
    name: CG-11, static issue census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # llvm-mca is the census's tool, and a Rust toolchain does not ship one,
      # which is why this is its own job rather than a step of `just vv`.
      # Ubuntu's `llvm` package keeps the binary versioned under
      # /usr/lib/llvm-*/bin, so locate it and hand it over explicitly --- a
      # gate that passes without its tool is worse than no gate.
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - name: locate llvm-mca
        run: |
          MCA=$(command -v llvm-mca || ls /usr/lib/llvm-*/bin/llvm-mca 2>/dev/null | head -1)
          test -n "$MCA" || { echo "llvm-mca was not installed by the llvm package"; exit 1; }
          echo "LLVM_MCA=$MCA" >> "$GITHUB_ENV"
      # x86-64 is the host, so the required half needs no cross target.
      - run: cargo run -q -p xtask -- issue-census
      - run: cargo test -p uor-matmul-conformance --test issue_census -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: issue-census
          path: target/issue-census/*.md

  selection:
    # `just vv` runs these tests too, inside a workspace-wide `cargo test`. The
    # leg is named anyway, for the reason `cross.yml`'s `CA-02` step is named:
    # a failure should say which claim broke in the check list, not inside a
    # run of everything. What is *only* here is the regeneration below --- no
    # other workflow runs an oracle generator, so until now nothing said that a
    # committed artifact and the script that made it still agree.
    name: CX-11, CD-24, CD-25, the selection half
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test -p uor-matmul-validate
          --test tropical_oracle --test selection --test provenance
      - run: cargo test -p uor-matmul-validate --lib corpus
      # `actions/setup-python` rather than the runner's own `python3`: Ubuntu
      # marks its system interpreter externally managed (PEP 668) and `pip
      # install` into it fails outright.
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: CX-11, the committed artifacts regenerate byte for byte
        run: |
          python3 -m pip install --quiet numpy
          python3 oracles/tropical/generate.py
          git diff --exit-code -- 'oracles/tropical/*.bin'
          # The manifest records the NumPy that generated it, which is a
          # property of this runner and not of the claim, so that one line is
          # allowed to move. Every other line --- the per-file digests included
          # --- has to be identical.
          CHANGED=$(git diff -U0 -- oracles/tropical/manifest.json \
            | grep -E '^[-+][^-+]' | grep -v '"numpy_version"' || true)
          test -z "$CHANGED" || {
            echo "$CHANGED"
            echo "the manifest changed beyond the NumPy version that wrote it"
            exit 1
          }

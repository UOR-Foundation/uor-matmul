# CA-02, CB-04, CD-06: the axes one machine cannot cover.
#
# The corpus digest must be the same number on every target. `MAX_K_BITS` is
# declared rather than probed precisely so that this is a comparison of one
# function against itself.
name: cross

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue runs the required checks on its merge group; without
  # this trigger the group reports nothing and the queue ejects the PR.
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  aarch64:
    name: CB-04, aarch64 NEON and dotprod
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs natively, so `is_aarch64_feature_detected!` reports the real host
      # and the NEON kernels are actually exercised rather than merely compiled.
      - run: cargo test --workspace
      - name: CA-02, the corpus digest on aarch64
        run: cargo test -p uor-matmul-conformance --test environment

  big-endian:
    name: CD-06, big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Explicit `tool:` for the reason `fuzz.yml` records: the tool-name tag form
      # can be rewritten to a version tag, after which the action installs nothing
      # and only warns. These two happened not to be, which is not a property to
      # rely on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      # s390x is big-endian. The serialized output is explicitly little-endian,
      # so this is the target that would catch a native-endian slip.
      - run: cross test -p uor-matmul-core -p uor-matmul-codec --target s390x-unknown-linux-gnu

  embedded:
    name: CA-03, no allocator symbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p uor-matmul --no-default-features --release --target thumbv7em-none-eabihf
      - run: cargo test -p uor-matmul-conformance --test environment no_allocator

  wasm:
    name: CB-05, wasm with and without SIMD128
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      # Explicit `tool:` for the reason `fuzz.yml` records: the tool-name tag form
      # can be rewritten to a version tag, after which the action installs nothing
      # and only warns. These two happened not to be, which is not a property to
      # rely on.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - uses: Swatinem/rust-cache@v2
      # Both configurations, because CB-05 is the claim that they agree.
      - run: cargo build -p uor-matmul --no-default-features --target wasm32-unknown-unknown
      - name: SIMD128 on
        run: cargo build -p uor-matmul --no-default-features --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -C target-feature=+simd128
      # `uor-matmul-kernels` and `-gemm` are the point: every SIMD128 line in
      # this workspace is in the first and every driver claim is in the second,
      # and this job ran neither. It also enabled SIMD128 only for `cargo build`,
      # so `CB-05` -- the claim that the two configurations agree -- was asserted
      # by a compile. Both are now *run*, and neither is implied by the other:
      # with SIMD128 off the selector offers only the portable sequence, so the
      # comparison the parity tests make is a different one (measured, 525
      # sequence comparisons against 657).
      #
      # `uor-matmul` is here for the raw-pointer face: `low` and `span` compute a
      # strided view's window in `isize`, 32 bits on this target and 64 on the
      # hosts every other job runs. Two tests that assumed a 64-bit `usize` were
      # already found this way.
      #
      # `-conformance` and `-validate` stay out because their tests read the
      # repository's own files, which a WASI sandbox does not hand them.
      - name: run the suite under wasmtime, SIMD128 off
        run: >-
          cargo test --release --target wasm32-wasip1
          -p uor-matmul-core -p uor-matmul-codec
          -p uor-matmul-kernels -p uor-matmul-gemm -p uor-matmul
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      - name: run the suite under wasmtime, SIMD128 on
        run: >-
          cargo test --release --target wasm32-wasip1
          -p uor-matmul-core -p uor-matmul-codec
          -p uor-matmul-kernels -p uor-matmul-gemm -p uor-matmul
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: -C target-feature=+simd128

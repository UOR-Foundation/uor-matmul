# CA-02, CB-04, CD-06: the axes one machine cannot cover.
#
# The corpus digest must be the same number on every target. `MAX_K_BITS` is
# declared rather than probed precisely so that this is a comparison of one
# function against itself.
name: cross

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue runs the required checks on its merge group; without
  # this trigger the group reports nothing and the queue ejects the PR.
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  aarch64:
    name: CB-04, aarch64 NEON and dotprod
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs natively, so `is_aarch64_feature_detected!` reports the real host
      # and the NEON kernels are actually exercised rather than merely compiled.
      - run: cargo test --workspace
      - name: CA-02, the corpus digest on aarch64
        run: cargo test -p uor-matmul-conformance --test environment

  big-endian:
    name: CD-06, big-endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Explicit `tool:` for the reason `fuzz.yml` records: the tool-name tag form
      # can be rewritten to a version tag, after which the action installs nothing
      # and only warns. These two happened not to be, which is not a property to
      # rely on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      # s390x is big-endian. The serialized output is explicitly little-endian,
      # so this is the target that would catch a native-endian slip.
      - run: cross test -p uor-matmul-core -p uor-matmul-codec --target s390x-unknown-linux-gnu

  embedded:
    name: CA-03, no allocator symbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p uor-matmul --no-default-features --release --target thumbv7em-none-eabihf
      - run: cargo test -p uor-matmul-conformance --test environment no_allocator

  cortex-m:
    name: CB-11, Cortex-M parity under qemu-system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add thumbv6m-none-eabi thumbv7em-none-eabihf
      # The `embedded` job above asserts the same tree *links* for a Cortex-M
      # target. This one runs it: no user-mode emulator covers Cortex-M, so the
      # CB parity checks are executed by qemu-system on an mps2 machine, and
      # the recipe fails if the PASS marker is absent.
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - run: just cortex-m-run

  vnni-emulated:
    # The AVX-512 VNNI sequences are validated only where hardware exists, and
    # the fleet's x86 runner declares no AVX-512 at all (the breakeven
    # instrument's resolved-pair print, 2026-08-01). qemu's TCG does not
    # implement AVX-512 at all --- it says so in its own warnings, and the
    # first version of this leg passed vacuously, which is the defect the
    # skip-guard below exists against. Intel's SDE executes AVX512VNNI
    # (its Icelake model), so the parity suite runs the sequences it skips
    # on every current runner. This is a correctness leg, never a timing
    # one: an emulator's clock is not silicon's. The VNNI boundary rows are
    # declaration-derived `build` claims and require no host clock.
    name: CB-02, AVX-512 VNNI parity under Intel SDE Icelake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Intel SDE (pinned, digest-checked)
        run: |
          curl -sSL -o /tmp/sde.tar.xz https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-lin.tar.xz
          echo "3173d2a5369e3385226b488d8b75403951bc14af601435fe707d9f83e0b533e6  /tmp/sde.tar.xz" | sha256sum -c -
          cd /tmp && tar -xf sde.tar.xz
      - run: cargo build --release -p uor-matmul-kernels --test parity
      # The guard, because the first version of this leg passed with the
      # VNNI sequences unexecuted: a parity suite that skipped them is the
      # failure this job exists against, so the skip message is the failure.
      - run: |
          BIN=$(find target/release/deps -maxdepth 1 -name 'parity-*' -type f -executable | head -1)
          echo "running $BIN under SDE (Icelake)"
          OUT=$(/tmp/sde-external-9.48.0-2024-11-25-lin/sde -icl -- "$BIN" --nocapture 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "Avx512Vnni: not available"; then
            echo "the VNNI sequences did not execute; the leg is vacuous" >&2
            exit 1
          fi
          echo "$OUT" | grep -q "avx512vnni_equals_portable_cb_03 ... ok"

  wasm:
    name: CB-05, wasm with and without SIMD128
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      # Explicit `tool:` for the reason `fuzz.yml` records: the tool-name tag form
      # can be rewritten to a version tag, after which the action installs nothing
      # and only warns. These two happened not to be, which is not a property to
      # rely on.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - uses: Swatinem/rust-cache@v2
      # Both configurations, because CB-05 is the claim that they agree.
      - run: cargo build -p uor-matmul --no-default-features --target wasm32-unknown-unknown
      - name: SIMD128 on
        run: cargo build -p uor-matmul --no-default-features --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -C target-feature=+simd128
      # `uor-matmul-kernels` and `-gemm` are the point: every SIMD128 line in
      # this workspace is in the first and every driver claim is in the second,
      # and this job ran neither. It also enabled SIMD128 only for `cargo build`,
      # so `CB-05` -- the claim that the two configurations agree -- was asserted
      # by a compile. Both are now *run*, and neither is implied by the other:
      # with SIMD128 off the selector offers only the portable sequence, so the
      # comparison the parity tests make is a different one (measured, 525
      # sequence comparisons against 657).
      #
      # `uor-matmul` is here for the raw-pointer face: `low` and `span` compute a
      # strided view's window in `isize`, 32 bits on this target and 64 on the
      # hosts every other job runs. Two tests that assumed a 64-bit `usize` were
      # already found this way.
      #
      # `-conformance` and `-validate` stay out because their tests read the
      # repository's own files, which a WASI sandbox does not hand them.
      - name: run the suite under wasmtime, SIMD128 off
        run: >-
          cargo test --release --target wasm32-wasip1
          -p uor-matmul-core -p uor-matmul-codec
          -p uor-matmul-kernels -p uor-matmul-gemm -p uor-matmul
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      - name: run the suite under wasmtime, SIMD128 on
        run: >-
          cargo test --release --target wasm32-wasip1
          -p uor-matmul-core -p uor-matmul-codec
          -p uor-matmul-kernels -p uor-matmul-gemm -p uor-matmul
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: -C target-feature=+simd128

  tropical:
    # The census's second product, on every off-host axis this repository
    # already names --- five targets, and the leg is what each of them can
    # actually hold.
    #
    # Three have a test runner, so the claims are *run* there: the accumulator
    # is an `i128` and the witness is a `usize`, which is where a big-endian
    # host and a 32-bit `usize` are not the same machine this was written on.
    # Two have no runner at all, because they are the no-allocator targets, and
    # there the leg is the build --- which is all `CA-03` can ask of new code
    # and exactly what it asks.
    #
    # `uor-matmul-core` and `uor-matmul-gemm` are the two crates the selection
    # half lives in: the element family and the gauge in the first, the driver,
    # the `(max, +)` epilogue and the witness in the second.
    name: "CT-08, CD-24, CD-25, the selection half: ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            how: native
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-latest
            how: cross
          - target: wasm32-wasip1
            runner: ubuntu-latest
            how: wasmtime
          - target: thumbv7em-none-eabihf
            runner: ubuntu-latest
            how: build
          - target: wasm32-unknown-unknown
            runner: ubuntu-latest
            how: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Explicit `tool:` for the reason this file records twice above: the
      # tool-name tag form can be rewritten to a version tag, after which the
      # action installs nothing and only warns.
      - if: matrix.how == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: matrix.how == 'wasmtime'
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - if: matrix.how == 'wasmtime' || matrix.how == 'build'
        run: rustup target add ${{ matrix.target }}
      # Natively, so the host is the architecture rather than an emulation of
      # it.
      - if: matrix.how == 'native'
        run: cargo test -p uor-matmul-core -p uor-matmul-gemm
      # s390x is big-endian: the one target that would catch an accumulator or
      # a witness serialized in native order.
      - if: matrix.how == 'cross'
        run: cross test -p uor-matmul-core -p uor-matmul-gemm --target ${{ matrix.target }}
      # `usize` is 32 bits here and 64 everywhere else, and the witness is a
      # `usize`. `--release` because a debug build under an interpreter takes
      # minutes to prove the same thing.
      - if: matrix.how == 'wasmtime'
        run: >-
          cargo test --release --target ${{ matrix.target }}
          -p uor-matmul-core -p uor-matmul-gemm
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      # No test runner exists for these, so the claim they can carry is that
      # the selection half links where there is no allocator at all.
      - if: matrix.how == 'build'
        run: >-
          cargo build -p uor-matmul --no-default-features
          --target ${{ matrix.target }}

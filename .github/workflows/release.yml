name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact numeric SemVer to publish, such as 0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    name: Publish crates and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates.io packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: just release "${{ inputs.version }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --target "${GITHUB_SHA}" \
            --title "v${{ inputs.version }}" \
            --generate-notes

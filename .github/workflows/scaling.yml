# CG-01 .. CG-08: the scaling axis, and CT-06's super-massive exactness.
#
# Every figure this job prints is `open`: measured and reported, never asserted.
# It does not gate a merge on a performance number, because a shared runner is a
# noisy machine and a gate on its timings would be a gate on the weather.
# What it does do is publish the fits, with their confidence intervals, so that
# a change of shape is visible.
name: scaling

on:
  push: { branches: [main] }
  schedule: [{ cron: "0 5 * * 0" }]
  workflow_dispatch:

jobs:
  scaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: fitted exponents, ours and every oracle's
        run: just scaling
      # CT-06, CG-08: gigabytes of operands and minutes of wall clock, so it is
      # not part of `vv` --- but it is part of CI, or the largest shapes would be
      # measured only when somebody remembered to.
      - name: CT-06, CG-08, super-massive input
        run: just massive
      # The representation-width phase's measurements, on the x86 runner. Every
      # figure these print is `open`, and every one asserts byte-identity inside
      # its timed region, so a red step is a correctness failure and never a
      # slow day. The logs are the artifact the measurement log references ---
      # an x86 pass is exactly what this host class is for.
      - name: CG-12, the sub-cubic recursion against the cubic walk
        run: |
          set -o pipefail
          mkdir -p target/measurements
          just strassen-sweep | tee target/measurements/strassen-x86.txt
      - name: CG-15, the float placement bridge
        run: |
          set -o pipefail
          just bridge-sweep | tee target/measurements/bridge-x86.txt
      - name: CG-14, the symbol path against the bus
        run: |
          set -o pipefail
          just symbol-bandwidth | tee target/measurements/symbol-bandwidth-x86.txt
      - name: CG-16, the symbol table in the scaled lane
        run: |
          set -o pipefail
          just symbol-tabulated | tee target/measurements/symbol-tabulated-x86.txt
      # The VNNI break-even rows in model/tiers.toml are `Unmeasured` until a
      # VNNI host runs the instrument: the first line is the host's own
      # answer, printed rather than assumed; the sweep measures the shipped
      # predicate's crossing against the derived one at whatever the runner
      # declares, and if that is not VNNI the rows say why they still stand.
      - name: the runner's ISA, printed not assumed
        run: lscpu | grep -i 'flags\|model name' | head -2
      - name: the tabulation break-even, measured at the runner's own declarations
        run: |
          set -o pipefail
          just breakeven | tee target/measurements/breakeven-x86.txt
      # The scalar-port co-issue experiment (the port-multiplexing thesis, the
      # last item in MEASUREMENT-LOG.md's queue): x86-only by construction,
      # and the runner above just printed what it has. The harness asserts
      # byte-identity inside every timed run, so a red step is a correctness
      # failure and never a slow day.
      - name: the scalar-port co-issue experiment
        run: |
          set -o pipefail
          just coissue | tee target/measurements/coissue-x86.txt
      # The repo's rust-toolchain.toml pins a channel whose target list does
      # not name wasip1, so the action's `targets:` installs it for stable and
      # the pinned toolchain still lacks it: the swar sweep failed E0463 and
      # the pipe swallowed it. Add the target to the toolchain that runs.
      - name: wasm32-wasip1 std for the pinned toolchain
        run: rustup target add wasm32-wasip1
      # CG-17 is a wasm measurement, so it is architecture-independent by
      # construction; it lives here because this is the measurements workflow.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - name: CG-17, the SWAR broadcast against the dot incumbent
        run: |
          set -o pipefail
          just swar-sweep | tee target/measurements/swar-wasm.txt
      - uses: actions/upload-artifact@v4
        with:
          name: measurements-x86
          path: target/measurements/

  measurements-aarch64:
    # The same sweeps on a native aarch64 runner: the NEON sequences run for
    # real, and the figures are the closest CI gets to the Apple dev machines
    # the phase was measured on. Same discipline: `open`, never a gate.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: CG-12, the sub-cubic recursion against the cubic walk
        run: |
          mkdir -p target/measurements
          just strassen-sweep | tee target/measurements/strassen-aarch64.txt
      - name: CG-15, the float placement bridge
        run: |
          set -o pipefail
          just bridge-sweep | tee target/measurements/bridge-aarch64.txt
      - name: CG-14, the symbol path against the bus
        run: |
          set -o pipefail
          just symbol-bandwidth | tee target/measurements/symbol-bandwidth-aarch64.txt
      - name: CG-16, the symbol table in the scaled lane
        run: |
          set -o pipefail
          just symbol-tabulated | tee target/measurements/symbol-tabulated-aarch64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: measurements-aarch64
          path: target/measurements/

# CG-01 .. CG-08: the scaling axis, and CT-06's super-massive exactness.
#
# Every figure this job prints is `open`: measured and reported, never asserted.
# It does not gate a merge on a performance number, because a shared runner is a
# noisy machine and a gate on its timings would be a gate on the weather.
# What it does do is publish the fits, with their confidence intervals, so that
# a change of shape is visible.
name: scaling

on:
  schedule: [{ cron: "0 5 * * 0" }]
  workflow_dispatch:
    inputs:
      suite:
        description: Work to run
        required: true
        default: full
        type: choice
        options:
          - full
          - comparison

jobs:
  comparison-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: prepare the durable report bundle
        if: always()
        run: |
          rm -rf target/benchmark-report
          mkdir -p target/benchmark-report
          printf 'benchmark job started\n' > target/benchmark-report/benchmark.log
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: run same-shape comparison benchmarks
        run: |
          set -o pipefail
          just bench-data 2>&1 | tee -a target/benchmark-report/benchmark.log
      - name: generate index.html from the benchmark output
        run: just bench-report
      - name: prepare the versioned repository report
        run: just bench-save "$GITHUB_RUN_ID"
      - name: publish the Markdown report in the Actions summary
        run: cat target/benchmark-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: upload report, raw inputs, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-benchmark-report
          path: target/benchmark-report/
          if-no-files-found: error
          retention-days: 30

  scaling:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: BDD conformance
        run: just bdd
      - name: fitted exponents, ours and every oracle's
        run: just scaling
      - name: prepare durable x86 measurement artifacts
        run: |
          mkdir -p target/measurements
          printf 'workflow=%s\nrun=%s\nrevision=%s\nplatform=x86_64-linux\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > target/measurements/run-context-x86.txt
      # CT-06, CG-08: gigabytes of operands and minutes of wall clock, so it is
      # not part of `vv` --- but it is part of CI, or the largest shapes would be
      # measured only when somebody remembered to.
      - name: CT-06, CG-08, super-massive input
        run: just massive
      # The representation-width phase's measurements, on the x86 runner. Every
      # figure these print is `open`, and every one asserts byte-identity inside
      # its timed region, so a red step is a correctness failure and never a
      # slow day. The logs are the artifact the measurement log references ---
      # an x86 pass is exactly what this host class is for.
      - name: CG-12, the sub-cubic recursion against the cubic walk
        run: |
          set -o pipefail
          mkdir -p target/measurements
          just strassen-sweep 2>&1 | tee target/measurements/strassen-x86.txt
      - name: CG-15, retained float workspace spellings
        run: |
          set -o pipefail
          just bridge-sweep 2>&1 | tee target/measurements/bridge-x86.txt
      - name: CG-21, pure-UOR float census and non-float controls
        run: |
          set -o pipefail
          just uor-float-sweep 2>&1 | tee target/measurements/uor-float-x86.txt
      - name: CG-14, the symbol path against the bus
        run: |
          set -o pipefail
          just symbol-bandwidth 2>&1 | tee target/measurements/symbol-bandwidth-x86.txt
      - name: CG-16, symbol tabulation over Atlas
        run: |
          set -o pipefail
          just symbol-tabulated 2>&1 | tee target/measurements/symbol-tabulated-x86.txt
      # The VNNI rows in model/tiers.toml are complete `build` declarations,
      # recomputed by CM-04 without a clock. The host line makes the separate
      # open timing artifact say which registered pair it actually exercised.
      - name: the runner's ISA, printed not assumed
        run: lscpu | grep -i 'flags\|model name' | head -2
      - name: the tabulation break-even, measured at the runner's own declarations
        run: |
          set -o pipefail
          just breakeven 2>&1 | tee target/measurements/breakeven-x86.txt
      # The scalar-port co-issue experiment (the port-multiplexing thesis, the
      # recorded decline in MEASUREMENT-LOG.md): x86-only by construction,
      # and the runner above just printed what it has. The harness asserts
      # byte-identity inside every timed run, so a red step is a correctness
      # failure and never a slow day.
      - name: the scalar-port co-issue experiment
        run: |
          set -o pipefail
          just coissue 2>&1 | tee target/measurements/coissue-x86.txt
      # The repo's rust-toolchain.toml pins a channel whose target list does
      # not name wasip1, so the action's `targets:` installs it for stable and
      # the pinned toolchain still lacks it: the swar sweep failed E0463 and
      # the pipe swallowed it. Add the target to the toolchain that runs.
      - name: wasm32-wasip1 std for the pinned toolchain
        run: rustup target add wasm32-wasip1
      # CG-17 is a wasm measurement, so it is architecture-independent by
      # construction; it lives here because this is the measurements workflow.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - name: CG-17, the SWAR broadcast against the dot incumbent
        run: |
          set -o pipefail
          just swar-sweep 2>&1 | tee target/measurements/swar-wasm.txt
      # CG-19: the census's second product, priced against its first. The two
      # lanes are one driver at two instantiations of `E`, so the ratio is the
      # arithmetic; the witness half is timed at both ends of the compare
      # pass's cost, because its second pass stops at the first index attaining
      # the maximum and a single fill would report a knob. Byte-identity is
      # asserted inside every timed run, so a red step is a correctness failure
      # and never a slow day.
      - name: CG-19, the selection lane against the accumulation lane
        run: |
          set -o pipefail
          just tropical-sweep 2>&1 | tee target/measurements/tropical-x86.txt
      - name: upload x86 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements-x86
          path: target/measurements/
          if-no-files-found: error
          retention-days: 30

  measurements-aarch64:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    # The same sweeps on a native aarch64 runner: the NEON sequences run for
    # real, and the figures are the closest CI gets to the Apple dev machines
    # the phase was measured on. Same discipline: `open`, never a gate.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - name: prepare durable aarch64 measurement artifacts
        run: |
          mkdir -p target/measurements
          printf 'workflow=%s\nrun=%s\nrevision=%s\nplatform=aarch64-linux\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > target/measurements/run-context-aarch64.txt
      - name: CG-12, the sub-cubic recursion against the cubic walk
        run: |
          mkdir -p target/measurements
          just strassen-sweep 2>&1 | tee target/measurements/strassen-aarch64.txt
      - name: CG-15, retained float workspace spellings
        run: |
          set -o pipefail
          just bridge-sweep 2>&1 | tee target/measurements/bridge-aarch64.txt
      - name: CG-21, pure-UOR float census and non-float controls
        run: |
          set -o pipefail
          just uor-float-sweep 2>&1 | tee target/measurements/uor-float-aarch64.txt
      - name: CG-14, the symbol path against the bus
        run: |
          set -o pipefail
          just symbol-bandwidth 2>&1 | tee target/measurements/symbol-bandwidth-aarch64.txt
      - name: CG-16, symbol tabulation over Atlas
        run: |
          set -o pipefail
          just symbol-tabulated 2>&1 | tee target/measurements/symbol-tabulated-aarch64.txt
      # The selection lane is a portable loop on both architectures, so the
      # aarch64 column is the one that says whether the ratio between the two
      # lanes is a property of the algebra or of this runner's x86 scheduler.
      - name: CG-19, the selection lane against the accumulation lane
        run: |
          set -o pipefail
          just tropical-sweep 2>&1 | tee target/measurements/tropical-aarch64.txt
      - name: upload aarch64 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements-aarch64
          path: target/measurements/
          if-no-files-found: error
          retention-days: 30

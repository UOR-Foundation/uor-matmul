[package]
name = "uor-matmul-kernels"
description = "Factorizations of one identity: portable, AVX2, AVX-512 VNNI, NEON, NEON dotprod, wasm SIMD128. The only crate with `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
bytemuck = { workspace = true }
uor-matmul-core = { workspace = true }

[features]
default = []
# Runtime CPU feature detection. Without it, selection is compile-time only,
# which is what an embedded target wants (C1).
std = []

[lints]
workspace = true

# The integration tests enable the crate's `std` feature explicitly in the
# acceptance and platform recipes. A self dev-dependency used to provide that
# feature, but Cargo resolves it from crates.io while preparing this package,
# before the package itself can exist there.
[dev-dependencies]
uor-matmul-model = { path = "../uor-matmul-model" }

# model/constants.toml --- the single source of every numeral in the library (R10).
#
# Nothing in this file is a limit on the library. Every entry is either a
# property of a machine integer type, or a property of a *caller's chosen
# instantiation*, or a constant discovered by measurement and recorded here ---
# with what measured it --- under the R1 allowlist. A prefetch distance or a
# blocking factor has no derivation, and a derivation story invented for one is
# fiction; the honest record is the measurement.
#
# `xtask check-model` regenerates the Rust consts from this file and fails if
# the generated values and the model disagree (CM-01).

spec = "uor-matmul/1"

# --------------------------------------------------------------------------
# The largest reduction depth any addressable machine can present.
#
# Declared here, not inferred from `usize::BITS`, so that the accumulator type
# is the same on a 64-bit host, a 32-bit host, and wasm32. A 32-bit host cannot
# reach this depth, which makes the width conservative there and never wrong
# anywhere --- and, more importantly, makes `CD-06` and `CA-02` comparisons of
# the same function rather than of two functions that happen to agree.
# --------------------------------------------------------------------------

max_k_bits = 64

# --------------------------------------------------------------------------
# Element types. `bits` and `full` are properties of the type, not choices.
# `full` is the largest magnitude the type can hold, so that `Full<E>` admits
# every value of `E` and the default path cannot reject anything (§5.2). It is
# written as a string because it is a magnitude, not a machine integer: |i64::MIN|
# has no i64 spelling, which is the same fact that makes the accumulator wider
# than the element type.
# --------------------------------------------------------------------------

[[element]]
name = "i8"
bits = 8
bytes = 1
full = "128" # |i8::MIN|; i8::MIN is an element of its own alphabet, not an error.
accumulator = "i128"

[[element]]
name = "i16"
bits = 16
bytes = 2
full = "32768"
accumulator = "i128"

[[element]]
name = "i32"
bits = 32
bytes = 4
full = "2147483648"
accumulator = "i128"

[[element]]
name = "i64"
bits = 64
bytes = 8
full = "9223372036854775808"
accumulator = "Limbs<3>"

# A complex element is not a special case: its `mac` is the scalar one applied
# componentwise, and the only thing the derivation needs to know is that the
# real part sums two element-products instead of one. That is `product_terms`,
# and it buys one bit. Nothing else in the library branches on it.

[[element]]
name = "Complex<i32>"
bits = 32
bytes = 8
product_terms = 2
full = "2147483648"
accumulator = "i128"

[[element]]
name = "Complex<i64>"
bits = 64
bytes = 16
product_terms = 2
full = "9223372036854775808"
accumulator = "Limbs<3>"

# --------------------------------------------------------------------------
# Canonical instantiations. W8A8 is `(i8, 127)`: the instantiation with the
# most instruction support and the most external oracles, and nothing else.
# A user who instantiates `(i16, 4095)` never sees any numeral from this table.
# --------------------------------------------------------------------------

[[instantiation]]
name = "W8A8"
element = "i8"
bound = 127
canonical = true
note = "the upstream formalization's single instantiation (B, cap) = (127, 2^31 - 1)"

[[instantiation]]
name = "W4A8"
element = "i8"
bound = 7
canonical = false

[[instantiation]]
name = "W16A16"
element = "i16"
bound = 32767
canonical = false

# --------------------------------------------------------------------------
# Narrow-register thresholds (§5.1, §7.3).
#
# These are NOT limits. `fits_narrow(b, cap, k)` answers one question: may this
# tile be accumulated in a narrower register without changing the answer? A
# `false` selects the wide register. Both compute the same integer, so the
# choice is invisible, has no failure mode, and never reaches the caller.
#
# Every value below is `floor(cap / per_step)` and is checked as such by
# `xtask check-constants` (R1). The numerals are pins, not definitions.
# --------------------------------------------------------------------------

[narrow]
cap_i32 = 2147483647 # i32::MAX

[[narrow.threshold]]
name = "i32_tile_w8a8"
sequence = "plain i32 tile, |a_i * w_i| <= 127 * 127"
per_step = 16129
k_max = 133144

[[narrow.threshold]]
name = "vnni_dpbusd_w8a8"
sequence = "offset to u8: |sum((a+128) * b)| <= 255 * 127"
per_step = 32385
k_max = 66311

[[narrow.threshold]]
name = "vnni_dpbusd_compensation_w8a8"
sequence = "offset compensation term: |128 * sum(b)| <= 128 * 127"
per_step = 16256
k_max = 132104

[[narrow.threshold]]
name = "avx2_madd_w8a8"
sequence = "_mm256_madd_epi16 pair, |a0*w0 + a1*w1| <= 2 * 127 * 127"
per_step = 32258
k_max = 66572 # madd *steps*, i.e. k <= 133144 --- the same reach as the plain tile

[[narrow.threshold]]
name = "neon_vmull_s16_w8a8"
sequence = "vmull_s8 accumulated in i16, |a*w| <= 127 * 127"
per_step = 16129
k_max = 2 # 3 * 127^2 = 48387 > i16::MAX; never accumulate more than two.
cap_override = 32767

[[narrow.threshold]]
name = "wasm_swar_field_w8a8"
sequence = "i64x2 SWAR broadcast: three biased fields at 21-bit spacing, |sum((a+128)*(b+128))| <= 255 * 255 a field"
per_step = 65025
k_max = 32 # the packed accumulator's chunk: 33 * 255^2 = 2145825 carries into the next field
cap_override = 2097151 # (1 << 21) - 1: sixteen product bits and five guard bits

# --------------------------------------------------------------------------
# Constants discovered by measurement. Tuning data, one table, explicitly
# allowlisted out of R1 (§5.1): these are cache-shaped, found empirically, and
# changing one cannot change any output byte --- only which traversal produces
# it. The table is named for its first members; any constant discovered by
# measurement belongs here with its `reason`, because a derivation story for
# such a constant is fiction.
# --------------------------------------------------------------------------

[blocking]
allowlisted_from_r1 = true
reason = "cache-shaped tuning; CD-01 asserts output is invariant under every value"
mc = 128
kc = 256
nc = 1024
# A packed panel whose lanes are steps of the reduction is a *transpose* of the
# operand, and a transpose done column by column reads the whole operand once
# per column. Done in tiles this wide it reads it once. The number is the
# machine's cache line in bytes; like the three above it can change which
# traversal produces an output byte and never which byte.
cache_line_bytes = 64
# The first level of data cache, in bytes. It sizes the tabulation table: a table
# of `code_space * mr` accumulator words is read once per output column, so a
# table that does not sit in L1 turns every column into a cache miss and the
# traversal stops paying. Like the four above, it can change which traversal
# produces an output byte and never which byte (CD-13).
l1_bytes = 32768
# The second level of data cache. It sizes the *depth* of a tabulation stack, and
# that is now the only thing it sizes: the stack has to stay resident because
# every column step is a random read into it. It used to also decide how often
# the exact accumulator was touched, because the lane was folded into the
# accumulator once per chunk; the lane carries the whole reduction now, so the
# accumulator is touched once per output element whatever the depth is.
# `tabulation_depth` takes half, which is what the sweep in ANALYSIS.md settles on.
l2_bytes = 524288
# Products one instruction of the dense `i8` tile issues, which is what
# `AVX2_I8_I32` declares as its `products_per_step`. It is not read by the
# shipped predicate --- that reads the `KernelSpec` of the sequence that will
# actually run, so a host with VNNI is priced at VNNI's density and not at this
# one. It is here because `model/tiers.toml`'s recorded break-evens are a
# derivation for one named pair of sequences, and this is that pair's dense
# half; rows written for another pair carry their own
# `kernel_products_per_step` on the row. Like the five above it can change
# which traversal produces an output byte and never which byte.
kernel_products_per_step = 16
# Rows of the output the dense traversal needs to amortize against. With fewer it
# pays twice: for lanes the tile does not fill, and --- the larger cost --- for a
# packed panel of `n * k` elements copied to compute `m * n * k` products, which
# at `m = 1` is the same order as the arithmetic. That is why a matrix-vector
# product is where a tile is weakest and a table is strongest, and why the
# tabulation predicate scales the dense side by the rows actually present.
# Without that term it declined the table at `m = 1`, where the table is five
# times faster; reading the chosen tile's own `mr` instead of this declined it
# for the same reason, because a one-row kernel wastes no lanes and still pays
# for the copy.
kernel_rows = 6
# The smallest base-case extent at which one level of the sub-cubic recursion
# pays on the i32-exact lane, on an Apple M4 Max (aarch64-apple-darwin),
# measured by `just strassen-sweep` (CG-12, 2026-07-30): at 512 a level costs
# more than its (7/8) product count saves, at 768 it wins. Like the rest of
# the table it can change which traversal produces an output byte and never
# which byte (CD-21).
strassen_min_extent = 384
# The smallest base-case extent at which one level of the modular bilinear
# factorization pays on a modular lane. Measured by the `modular_strassen`
# bench group (2026-07-31, Apple M4 Max, quiet window): at 512 cubed the
# level loses to the direct packed modular walk on both rings (0.60x at i8,
# 0.96x at i32) and at 1024 cubed it wins (1.14x, 1.11x), so the crossover is
# between the two and the threshold is the smallest measured winner. The win
# widens with size (1.57x at i8 4096 cubed); MEASUREMENT-LOG.md carries the
# table, and the figure stays `open` as a one-host measurement. Like the rest
# of the table it changes which traversal produces a byte and never which
# byte (CD-23).
strassen_modular_min_extent = 1024

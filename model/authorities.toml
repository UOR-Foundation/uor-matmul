[[authority]]
id = "IEEE-754-2019"
name = "binary32 and binary64 interchange formats"
citation = "IEEE Std 754-2019, clause 3.4 (formats) and clause 6 (infinity, NaN)."
checksum = "none"
checksum_reason = "a published standard, referenced by clause rather than copied"
statement = """a finite IEEE 754 value is a bit pattern naming an exact dyadic
rational; NaN and infinity propagate by the clause 6 rules."""
realized_by = ["CT-03", "CU-04"]

[[authority]]
id = "RING-HOM-2W"
name = "reduction modulo 2^w is a ring homomorphism"
citation = """Elementary. Z -> Z/2^w is a ring homomorphism, so reducing a sum
once at the end equals reducing at every step."""
checksum = "none"
checksum_reason = "an elementary fact, stated rather than sourced"
statement = """`EncodeMode::Wrapping` into a w-bit output reproduces a classical
wrapping accumulator's bytes exactly, at every depth, including depths where
that accumulator has wrapped many times. This is why the integer oracles agree
byte for byte over the whole corpus with no exempted region (§3.4)."""
realized_by = ["CX-01", "CX-02", "CX-03", "CX-04", "CX-10"]

[[authority]]
id = "INTEL-VNNI"
name = "VPDPBUSD and VPDPWSSD semantics"
citation = "Intel Intrinsics Guide, `_mm512_dpbusd_epi32`, `_mm512_dpwssd_epi32`."
checksum = "none"
checksum_reason = "a vendor reference, cited by intrinsic name"
statement = """vpdpbusd multiplies unsigned bytes by signed bytes and accumulates
into i32; vpdpwssd multiplies signed words. The per-step magnitudes that follow
are what `model/constants.toml`'s narrow thresholds are derived from."""
realized_by = ["CB-03", "CU-03"]

[[authority]]
id = "UOR-ADDR-1"
name = "kappa addressing"
citation = "UOR-Foundation/uor-addr-1 v0.1.0, `uor_addr_1::address`."
checksum = "Cargo.lock"
checksum_reason = "a crates.io dependency; the resolved version is the pin"
statement = "JCS-RFC8785 + NFC then SHA-256 over the canonical manifest"
realized_by = ["CK-05"]

[[authority]]
id = "UOR-R4-OPKERNEL"
name = "the operation census, and the absence of a multiplication field in it"
citation = "UOR-Foundation/uor-r4, `crates/uor-r4-core/src/transformerless/runtime.rs`, `OpKernel`."
checksum = "none"
checksum_reason = """an upstream source file, cited and not vendored (N2). What
this repository pins is its own census, which `CU-06` reads."""
statement = """the runtime declares its complete arithmetic interface as an
operation census --- adds, xors, shifts, compares, table reads, candidate scans
--- and there is no multiplication method and no multiplication field. When the
operand is a code, the product is a table read."""
realized_by = ["CU-06", "CG-10"]

[[authority]]
id = "TF1"
name = "the transformer over the UOR Atlas"
citation = "UOR-Foundation, TF1 --- Formalization of the Transformer over the UOR Atlas, upstream."
checksum = "none"
checksum_reason = """the formalization is a document, upstream, and is cited
rather than vendored (N2). This repository contains no proof development and
pins no proof artifact; what it pins is its own behaviour against the clauses
it realizes."""
statement = """the selection half of the census: (max, +) is the selection
algebra (A-4), a masked position is the semiring zero (A-6), the witness's
tie-break is the smallest index and is total (D-6), the native operation set is
matrix products under complete accumulation, max, addition, table lookup and
power-of-two shifts (D-8), and the two gauges have canonical sections ---
recentring (G-2) and dyadic placement (G-5). The canonical Atlas instance is
`(q,T,O)=(4,3,8)`, scope indexes copies outside the `T*O` carrier (D-1, S-18),
addresses are words of unbounded depth (D-2), modality carries a mirror (S-3),
the four spectral projectors resolve the carrier exactly (S-12), and
the context block's rank derives the sign-refinement leaf count (S-17), while
whole-carrier selection consumes interaction information that marginal block
selection cannot (S-19, S-20)."""

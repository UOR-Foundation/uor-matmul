# model/authorities.toml --- what this repository cites and does not re-derive
# (§12, N2, R4).
#
# An authority tells the implementation what identity to realize. It is cited
# the way an instruction-set manual is cited: never re-derived here, never
# vendored, and never gated on. `CM-03` fails the build if a `some-true` claim
# names an authority that has no row in this file.
#
# `citation` is what a third party needs to find the source. `checksum` is over
# the committed artifact in `oracles/` where one exists; an authority that is a
# document rather than an artifact records `checksum = "none"` and says why, so
# that a missing checksum is a stated fact rather than an omission.

spec = "uor-matmul/1"

[[authority]]
id = "CL-MM01"
name = "codec invariance"
citation = "UorMatMul.lean, UOR-Foundation, upstream. Theorem CL-MM01."
checksum = "none"
checksum_reason = """the formalization is upstream and is cited, not vendored
(N2). This repository contains no proof development and pins no proof artifact;
what it pins is its own behaviour against the identity."""
statement = """the accumulation does not depend on the codec: two coded matrices
with equal decoded streams produce equal products."""
realized_by = ["CK-01", "CK-02", "CK-05"]

[[authority]]
id = "CL-MM02"
name = "scalar equals block"
citation = "UorMatMul.lean, UOR-Foundation, upstream. Lemma `scalar_eq_block`."
checksum = "none"
checksum_reason = "cited upstream, not vendored (N2)"
statement = "a scalar codec is the block codec of its singletons"
realized_by = ["CK-01"]


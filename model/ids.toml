# model/ids.toml --- the conformance ID register (§2.1).
#
# Every ID the plan names, in one place, so that nothing is referenced without
# being defined. `CONFORMANCE.md` is generated from this file. A test whose name
# ends in an ID not listed here fails `check-model`, and an ID listed here with
# no scenario and no test fails it too (CM-02).
#
# `level` is the UTQC honesty level (R4):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/` and a test whose name ends in the
# ID (R9, R15, CM-02). There is no "pending" state: a capability that is not
# built does not get a row, and every row in this file is built.
#
# `refuted_by` is the observation that would break the row, in the sense the
# upstream formalization's "Refuted by." line means: not a caveat and not a
# limitation, but the experiment whose outcome decides the claim. It is
# required, because a row that named no such experiment would be indexed,
# scenarioed, tested, and about nothing --- and the omission would read as
# "there is none". `check-model` refuses an empty one.

spec = "uor-matmul/1"


[[id]]
id = "CS-01"
level = "build"
suite = "structural"
statement = """`C <- alpha*A*B + beta*C` with A `m x k`, B `k x n`, C `m x n`"""
refuted_by = """a conformant triple whose computed `C` differs from the defining sum at one cell"""


property of a codebook rather than of a (model, codebook) pair it was measured
on."""

[[claim]]
id = "OPEN-ORACLE-ULPS"
level = "open"
statement = """each classical float oracle's rounding error against the exact
value this library holds, in ulps. Reported by CX-05 through CX-09."""
refuted_by = """a recorded ulp figure not reproducing at the host, seed, and
harness the record names."""

[[claim]]
id = "OPEN-RESIDENCY"
level = "open"
statement = """the residency collapse of the coded tiers, measured as a scaling
constant against the oracle (CG-03), never asserted."""
refuted_by = """the recorded residency constant not reproducing at the host and
codec the record names."""

isa = "neon"
code_space = 256
block = 4
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
build_products_per_step = 1
note = "one table instruction covers exactly what one dot-product instruction covers at this block, so the build is never repaid --- the AVX2 row's 1025 does not transfer to this pair."
honesty = "build"

[[tabulation]]

# model/tiers.toml --- the codec tiers (§6.2).
#
# Every row is an *instantiation* of the one `Codec` trait, not a special case.
# A tier contributes no arithmetic: it names a decode, and the accumulation
# downstream of it is the same accumulation for every row in this table. That
# is CL-MM01 in table form, and CK-02 is the test that says it.

spec = "uor-matmul/1"

[[tier]]
id = "Identity"
rust = "Identity"
code = "E"
block = 1
table = "none"
note = "zero-sized; decoding is a validated copy"
honesty = "build"

[[tier]]
id = "Grid"
rust = "Grid<'a, E, Bd, N>"
code = "index"
block = 1
table = "borrowed [Alphabet<E, Bd>; N]"
note = "any lookup codec of any code width; the 16-entry i4 grid is Grid<16>"
honesty = "build"

[[tier]]
id = "Packed"
rust = "Packed<'a, C, P>"
code = "u8"
block = "P * C::BLOCK"
table = "delegated to C"
note = "unpacks P sub-codes from one stored byte, then defers to C. Low sub-code first (normative, pinned by case `nibble-order`)."
honesty = "build"

[[tier]]
id = "Book"
rust = "Book<'a, E, Bd, N, BLK, K = u16>"
code = "index (u16, or u8 where N <= 256)"
block = "BLK"
table = "borrowed [[Alphabet<E, Bd>; BLK]; N]"
note = "any codebook; E8 is Book<256, 8>, and Book<256, 8, u8> (e8_codec_u8) stores the index stream at one byte a code --- 0.125 B/decoded weight, the CG-03 figure --- against the u16 spelling's two (CK-15)"
honesty = "build"

[[tier]]
id = "Sign"
rust = "Sign<E, Bd, BLK, K = u16>"
code = "K (u16, or u8 where BLK <= 8)"
block = "BLK"
table = "none: the codebook is the constant {-1, +1}"
note = "weights in {-1, +1}, one bit per element. Bit t of the code is element t; set is +1, clear is -1, low bit first (normative, CK-03's order). The same decode as the Packed<Grid<2>,8> spelling (CK-11) with the code *being* the index, so as_index_stream always answers Some and the traversal builds nothing. The u8 spelling stores the stream at half the bytes (CK-15)."
honesty = "build"

[[tier]]
id = "Ternary"
rust = "Ternary<E, Bd, BLK, K = u16>"
code = "K (u16, or u8 where BLK <= 4)"
block = "BLK"
table = "none: the codebook is the constant {-1, 0, +1}"
note = "weights in {-1, 0, +1}, two bits per element. Digit t of the code (bits 2t and 2t+1) is element t: 0 is -1, 1 is 0, 2 is +1, and 3 --- the dead digit no ternary encoder emits --- decodes to 0, low digit first (normative, the order Packed reads its sub-codes in, CK-03). The same decode as the Packed<Grid<4>,4> spelling (CK-12) with the code *being* the index, so as_index_stream always answers Some and the traversal builds nothing. The u8 spelling stores the stream at half the bytes (CK-15)."
honesty = "build"

[[tier]]
id = "Offset"
rust = "Offset<C>"
code = "C::Code"
block = "C::BLOCK"
table = "delegated to C"
note = "d(c) - z: asymmetric quantization as a codec composition, not a feature"
honesty = "build"

[[tier]]
id = "Runs"
rust = "Runs<'a, C>"
code = "run entry"
block = "run length"
table = "delegated to C"
note = "sparse storage as a codec. The arithmetic stays dense and no sparse-specific speedup is claimed; the benefit is residency and CG-03 measures it like any other codec's (D-16)."
honesty = "build"

[[tier]]
id = "Transcode"
rust = "Transcode<C1, C2>"
code = "C1::Code"
block = "C2::BLOCK"
table = "delegated"
note = "the upstream transcode_decode composite"
honesty = "build"

[[tier]]
id = "Arena"
rust = "Arena<'a, E, N, K>"
code = "index"
block = 1
table = "borrowed [Alphabet<E, Whole<E>>; N]"
note = "a codebook of one artifact's distinct float bit patterns, canonicalized by `canonicalize` (CK-10). The code width K is a parameter of the one tier, u16 by default and u8 where the artifact's distinct patterns fit a byte (CK-14): two residencies, one decode. The symbols are the identity level; the decode is the same table read as Grid."
honesty = "build"

# --------------------------------------------------------------------------
# Tabulation. One row per *enumerable* codec: a codec whose code space can be
# enumerated, which is what a table indexed by code requires.
#
# When the operand is a code, the product is a table read. `T[i][p][c]` is the
# partial sum of one row of A against the block code `c` decodes to, so the
# column loop below it contains one table read and one add per code and no
# multiply at all. That is not an approximation of the dense traversal: an exact
# sum is a function of the multiset of its products, so regrouping them changes
# nothing, and CD-13 asserts it byte for byte.
#
#   tabulated instructions = m*k*S/table_step + m*n*k/table_step
#   dense instructions     = m*k*n/kernel_products_per_step
#
# Instructions, not operations, and both sides are declarations a *sequence*
# makes about itself. `table_step` is `block * lanes_per_add`: one register of
# lanes, each carrying a whole codeword. It is not `block * rows` --- a tile of
# `rows` is `rows / lanes_per_add` instructions --- and it was, which over-stated
# the table by the register count. That error cancelled against a
# `kernel_products_per_step` naming `vpdpbusd` on hosts that have no `vpdpbusd`,
# and two errors that cancel are not a derivation. The shipped predicate reads
# both numbers off the two specs at run time; the rows below are the same
# derivation for one named pair.
#
# `lanes_per_add` is the register width the row is written for, and the row
# names its instruction set. The first-recorded rows are the AVX2 pair ---
# `AVX2_TABLE`'s eight lanes, a 256-bit register of `i32`, against
# `AVX2_I8_I32`'s sixteen products a step --- and the per-ISA sections after
# the AVX2 rows are the same derivation at the pairs the other shipped
# sequences declare: sixteen lanes at 512 bits, four at 128. The reference
# sequence is 1, and the break-even against a dense tile is then far larger ---
# which is the honest statement that a table without vector adds is not worth
# building.
#
# The dense side is per-ISA too. A row's `kernel_products_per_step` is the
# `products_per_step` of the tile kernel the dense path would run on that ISA;
# the AVX2 rows omit it because the model's `kernel_products_per_step` *is*
# `AVX2_I8_I32`'s declaration. The dense row count is the blocking constant
# `kernel_rows` on every ISA, because the shipped predicate reads it rather
# than the chosen tile's `mr`.
#
# The block is also the *density* knob, and that is the claim worth reading twice.
# One 256-bit add covers `8 * block` products at a 32-bit lane: eight output rows,
# each carrying a whole codeword. At `Book<256, 8>` that is 64 products per
# arithmetic instruction, against 32 for `vpdpbusd` --- the densest integer
# instruction x86 has --- which cannot be told to cover more. A codec that names a
# longer block is a denser instruction, with no change to the hardware and none to
# the traversal. What it pays is `lane_bytes / block` bytes per product, so a
# longer block buys traffic as well.
#
# `break_even_n` is the first `n` at which this declaration-derived reference
# comparison wins. It is absent when no `n` does --- for the ordinary block-one
# product build, and whenever `block * lanes_per_add` does not even reach what
# one dense instruction covers. The contextual Scaled64 block-one builder is a
# different declared operation census (lookup convolution plus Horner adds); its
# CG-16 measurements are recorded as open evidence and explicitly found no
# geometry-invariant scalar crossover, so they are not promoted into this
# product-build derivation.
#
# CM-04 recomputes every `break_even_n` here from `code_space`, `block`,
# `rows`, `lanes_per_add`, `build_products_per_step`, and the row's dense-tile
# declaration, and checks the first three against the codec's own `Enumerable`
# and `Codec` consts. The exact comparison is
# `n*q*(block*lanes-effective) > code_space*effective*block*lanes`; build and
# gather density are independent declarations and cannot be substituted.
# --------------------------------------------------------------------------

[[tabulation]]
codec = "Grid<16>"
code_space = 16
block = 1
rows = 16
lanes_per_add = 8
note = "the i4 grid's ordinary product build: one code names one element, so the reference operation comparison saves no add and no n repays its build. This is not the contextual Scaled64 lookup/Horner declaration."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<16>, 2>"
code_space = 256
block = 2
rows = 16
lanes_per_add = 8
note = "a nibble pair covers 16 products per issued instruction, which is exactly what one dense instruction covers, so the build is never repaid and no n makes it pay. A codec has to name a longer block than this before a table is worth building."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<4>, 4>"
code_space = 256
block = 4
rows = 16
lanes_per_add = 8
build_products_per_step = 1
break_even_n = 8193
note = "the lookup build produces one table product per issued recurrence while the gather covers 32 products; pricing the two as the same density would understate the build by eight."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<2>, 8>"
code_space = 256
block = 8
rows = 16
lanes_per_add = 8
build_products_per_step = 8
break_even_n = 683
note = "the sign tier: one-bit codes, eight to a byte, over a [-1,+1] table. Its bound-one AVX2 builder produces eight products per issued step, unlike E8's general lookup build, so equal code space and block do not imply equal break-even."
honesty = "build"

[[tabulation]]
codec = "Book<256, 8>"
code_space = 256
block = 8
rows = 16
lanes_per_add = 8
build_products_per_step = 1
break_even_n = 5462
note = "E8's general lookup builder emits one table product per issued recurrence; the eight-lane gather does not make that build eight-wide. CM-04 records the conservative declaration count. Wall-clock crossover remains CG-10/open and does not overwrite this derived instruction boundary."
honesty = "build"

[[tabulation]]
codec = "Sign<8>"
code_space = 256
block = 8
rows = 16
lanes_per_add = 8
build_products_per_step = 8
break_even_n = 683
note = "the sign tier as its own codec: one bit per element, the code being the index. The Gray walk inherits the AVX2 bound-one builder's eight-product declaration and changes only its build body/census."
honesty = "build"

[[tabulation]]
codec = "Ternary<4>"
code_space = 256
block = 4
rows = 16
lanes_per_add = 8
build_products_per_step = 8
break_even_n = 1025
note = "the ternary tier as its own codec: two bits per element, the code being the index. Its bound-one AVX2 build covers eight products per issued step; the same-size general Grid lookup build does not."
honesty = "build"

[[tabulation]]
codec = "Offset<Grid<16>>"
code_space = 16
block = 1
rows = 16
lanes_per_add = 8
note = "a zero point relabels the image, never the code space, so an asymmetric quantization tabulates exactly as its inner codec does."
honesty = "build"

[[tabulation]]
codec = "Arena<4>"
code_space = 4
block = 1
rows = 16
lanes_per_add = 8
note = "the float arena, at one representative code space --- the space is per artifact. Scaled64 (CD-20) keeps the slab at eight bytes a word and replaces the dense Atlas contraction with a balanced-octet lookup convolution plus Horner placement. That operation census is not Grid<16>'s product-build derivation. CG-16's retained open evidence found no geometry-invariant scalar threshold; forced Tabulated remains the measurement/control factorization without turning an overlapped clock result into a derived rule."
honesty = "build"

# --------------------------------------------------------------------------
# The same derivation at the other pairs this workspace ships. Each section
# names its two sequences; the numbers are declarations read off the specs,
# and CM-04 recomputes them exactly as it does the AVX2 rows'. Only the codecs
# with `block > 1` are repeated. Their declaration-derived rows do not stand in
# for the separately measured contextual Scaled64 block-one sequence.
# --------------------------------------------------------------------------

# NEON: `NEON_TABLE_LANES`, four `i32` lanes to a 128-bit add, against
# `NEON_DOTPROD_I8_I32`'s sixteen products a step --- the dense tile an
# aarch64 host with the ARMv8.2-A dot-product extension runs. A NEON host
# without the extension prices the dense side at `NEON_I8_I32`'s eight and
# lands on the wasm rows' numbers. The pair is the one the measurement host
# (an Apple M4 Max) runs, and the `Book<256, 8>` row carries what it measured.

[[tabulation]]
codec = "Packed<Grid<16>, 2>"
isa = "neon"
code_space = 256
block = 2
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
note = "a nibble pair covers eight products per issued instruction at this pair, half of what one dot-product instruction covers, so no n makes it pay."
honesty = "build"

[[tabulation]]

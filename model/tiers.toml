# model/tiers.toml --- the codec tiers (§6.2).
#
# Every row is an *instantiation* of the one `Codec` trait, not a special case.
# A tier contributes no arithmetic: it names a decode, and the accumulation
# downstream of it is the same accumulation for every row in this table. That
# is CL-MM01 in table form, and CK-02 is the test that says it.

spec = "uor-matmul/1"

[[tier]]
id = "Identity"
rust = "Identity"
code = "E"
block = 1
table = "none"
note = "zero-sized; decoding is a validated copy"
honesty = "build"

[[tier]]
id = "Grid"
rust = "Grid<'a, E, Bd, N>"
code = "index"
block = 1
table = "borrowed [Alphabet<E, Bd>; N]"
note = "any lookup codec of any code width; the 16-entry i4 grid is Grid<16>"
honesty = "build"

[[tier]]
id = "Packed"
rust = "Packed<'a, C, P>"
code = "u8"
block = "P * C::BLOCK"
table = "delegated to C"
note = "unpacks P sub-codes from one stored byte, then defers to C. Low sub-code first (normative, pinned by case `nibble-order`)."
honesty = "build"

[[tier]]
id = "Book"
rust = "Book<'a, E, Bd, N, BLK, K = u16>"
code = "index (u16, or u8 where N <= 256)"
block = "BLK"
table = "borrowed [[Alphabet<E, Bd>; BLK]; N]"
note = "any codebook; E8 is Book<256, 8>, and Book<256, 8, u8> (e8_codec_u8) stores the index stream at one byte a code --- 0.125 B/decoded weight, the CG-03 figure --- against the u16 spelling's two (CK-15)"
honesty = "build"

[[tier]]
id = "Sign"
rust = "Sign<E, Bd, BLK, K = u16>"
code = "K (u16, or u8 where BLK <= 8)"
block = "BLK"
table = "none: the codebook is the constant {-1, +1}"
note = "weights in {-1, +1}, one bit per element. Bit t of the code is element t; set is +1, clear is -1, low bit first (normative, CK-03's order). The same decode as the Packed<Grid<2>,8> spelling (CK-11) with the code *being* the index, so as_index_stream always answers Some and the traversal builds nothing. The u8 spelling stores the stream at half the bytes (CK-15)."
honesty = "build"

[[tier]]
id = "Ternary"
rust = "Ternary<E, Bd, BLK, K = u16>"
code = "K (u16, or u8 where BLK <= 4)"
block = "BLK"
table = "none: the codebook is the constant {-1, 0, +1}"
note = "weights in {-1, 0, +1}, two bits per element. Digit t of the code (bits 2t and 2t+1) is element t: 0 is -1, 1 is 0, 2 is +1, and 3 --- the dead digit no ternary encoder emits --- decodes to 0, low digit first (normative, the order Packed reads its sub-codes in, CK-03). The same decode as the Packed<Grid<4>,4> spelling (CK-12) with the code *being* the index, so as_index_stream always answers Some and the traversal builds nothing. The u8 spelling stores the stream at half the bytes (CK-15)."
honesty = "build"

[[tier]]
id = "Offset"
rust = "Offset<C>"
code = "C::Code"
block = "C::BLOCK"
table = "delegated to C"
note = "d(c) - z: asymmetric quantization as a codec composition, not a feature"
honesty = "build"

[[tier]]
id = "Runs"
rust = "Runs<'a, C>"
code = "run entry"
block = "run length"
table = "delegated to C"
note = "sparse storage as a codec. The arithmetic stays dense and no sparse-specific speedup is claimed; the benefit is residency and CG-03 measures it like any other codec's (D-16)."
honesty = "build"

[[tier]]
id = "Transcode"
rust = "Transcode<C1, C2>"
code = "C1::Code"
block = "C2::BLOCK"
table = "delegated"
note = "the upstream transcode_decode composite"
honesty = "build"

[[tier]]
id = "Arena"
rust = "Arena<'a, E, N, K>"
code = "index"
block = 1
table = "borrowed [Alphabet<E, Whole<E>>; N]"
note = "a codebook of one artifact's distinct float bit patterns, canonicalized by `canonicalize` (CK-10). The code width K is a parameter of the one tier, u16 by default and u8 where the artifact's distinct patterns fit a byte (CK-14): two residencies, one decode. The symbols are the identity level; the decode is the same table read as Grid."
honesty = "build"

# --------------------------------------------------------------------------
# Tabulation. One row per *enumerable* codec: a codec whose code space can be
# enumerated, which is what a table indexed by code requires.
#
# When the operand is a code, the product is a table read. `T[i][p][c]` is the
# partial sum of one row of A against the block code `c` decodes to, so the
# column loop below it contains one table read and one add per code and no
# multiply at all. That is not an approximation of the dense traversal: an exact
# sum is a function of the multiset of its products, so regrouping them changes
# nothing, and CD-13 asserts it byte for byte.
#
#   tabulated instructions = m*k*S/table_step + m*n*k/table_step
#   dense instructions     = m*k*n/kernel_products_per_step
#
# Instructions, not operations, and both sides are declarations a *sequence*
# makes about itself. `table_step` is `block * lanes_per_add`: one register of
# lanes, each carrying a whole codeword. It is not `block * rows` --- a tile of
# `rows` is `rows / lanes_per_add` instructions --- and it was, which over-stated
# the table by the register count. That error cancelled against a
# `kernel_products_per_step` naming `vpdpbusd` on hosts that have no `vpdpbusd`,
# and two errors that cancel are not a derivation. The shipped predicate reads
# both numbers off the two specs at run time; the rows below are the same
# derivation for one named pair.
#
# `lanes_per_add` is the register width the row is written for, and the row
# names its instruction set. The first-recorded rows are the AVX2 pair ---
# `AVX2_TABLE`'s eight lanes, a 256-bit register of `i32`, against
# `AVX2_I8_I32`'s sixteen products a step --- and the per-ISA sections after
# the AVX2 rows are the same derivation at the pairs the other shipped
# sequences declare: sixteen lanes at 512 bits, four at 128. The reference
# sequence is 1, and the break-even against a dense tile is then far larger ---
# which is the honest statement that a table without vector adds is not worth
# building.
#
# The dense side is per-ISA too. A row's `kernel_products_per_step` is the
# `products_per_step` of the tile kernel the dense path would run on that ISA;
# the AVX2 rows omit it because the model's `kernel_products_per_step` *is*
# `AVX2_I8_I32`'s declaration. The dense row count is the blocking constant
# `kernel_rows` on every ISA, because the shipped predicate reads it rather
# than the chosen tile's `mr`.
#
# The block is also the *density* knob, and that is the claim worth reading twice.
# One 256-bit add covers `8 * block` products at a 32-bit lane: eight output rows,
# each carrying a whole codeword. At `Book<256, 8>` that is 64 products per
# arithmetic instruction, against 32 for `vpdpbusd` --- the densest integer
# instruction x86 has --- which cannot be told to cover more. A codec that names a
# longer block is a denser instruction, with no change to the hardware and none to
# the traversal. What it pays is `lane_bytes / block` bytes per product, so a
# longer block buys traffic as well.
#
# `break_even_n` is the first `n` at which the table wins, and it is absent when no
# `n` does --- either because `block = 1` names one element per code, or because
# `block * lanes_per_add` does not even reach what one dense instruction covers.
#
# CM-04 recomputes every `break_even_n` here from `code_space`, `block`,
# `rows`, `lanes_per_add` and the row's dense-tile declaration, and checks the
# first three against the codec's own `Enumerable` and `Codec` consts.
# --------------------------------------------------------------------------

[[tabulation]]
codec = "Grid<16>"
code_space = 16
block = 1
rows = 16
lanes_per_add = 8
note = "the i4 grid. One code, one element: the table saves the multiply and no adds, so no n makes it pay and `tabulation_pays` refuses it."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<16>, 2>"
code_space = 256
block = 2
rows = 16
lanes_per_add = 8
note = "a nibble pair covers 16 products per issued instruction, which is exactly what one dense instruction covers, so the build is never repaid and no n makes it pay. A codec has to name a longer block than this before a table is worth building."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<4>, 4>"
code_space = 256
block = 4
rows = 16
lanes_per_add = 8
break_even_n = 1025
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<2>, 8>"
code_space = 256
block = 8
rows = 16
lanes_per_add = 8
break_even_n = 683
note = "the sign tier: one-bit codes, eight to a byte, over a [-1,+1] table. The same code space and block as E8's book, so the same break-even --- a longer block is what makes a table pay at all, and bound 1 is where the build's only multiply is a sign flip."
honesty = "build"

[[tabulation]]
codec = "Book<256, 8>"
code_space = 256
block = 8
rows = 16
lanes_per_add = 8
break_even_n = 683
note = "E8. The row to read first: 683 is below every transformer layer width in practical use, and the amortization is over n, so it holds for a single decoded token as much as for a prefill. Measured, consistent with this derivation: the breakeven instrument (scaling.yml's x86 job, `just breakeven`) flips kernels to table between n = 512 and n = 683 on the CI x86 runner, which declares no AVX-512 and therefore resolves exactly this pair --- the crossing the runner's own lscpu line names."
honesty = "build"

[[tabulation]]
codec = "Sign<8>"
code_space = 256
block = 8
rows = 16
lanes_per_add = 8
break_even_n = 683
note = "the sign tier as its own codec: one bit per element, the code being the index. The same code space and block as the Packed<Grid<2>,8> spelling, so the same break-even --- what changes is not the op count but the gather, which reads the operand's own memory instead of a built index stream."
honesty = "build"

[[tabulation]]
codec = "Ternary<4>"
code_space = 256
block = 4
rows = 16
lanes_per_add = 8
break_even_n = 1025
note = "the ternary tier as its own codec: two bits per element, the code being the index. The same code space and block as the Packed<Grid<4>,4> spelling, so the same break-even --- what changes is not the op count but the gather, which reads the operand's own memory instead of a built index stream."
honesty = "build"

[[tabulation]]
codec = "Offset<Grid<16>>"
code_space = 16
block = 1
rows = 16
lanes_per_add = 8
note = "a zero point relabels the image, never the code space, so an asymmetric quantization tabulates exactly as its inner codec does."
honesty = "build"

[[tabulation]]
codec = "Arena<4>"
code_space = 4
block = 1
rows = 16
lanes_per_add = 8
note = "the float arena, at one representative code space --- the space is per-artifact, and at block = 1 the conclusion is the Grid<16> one: the table saves the multiply and no adds, so selection declines it and the byte-identical dense route runs (CD-14). The u8 code width (CK-14, CD-18) changes the residency and not this count. The scaled integer lane (CD-20) is what makes the table fit at all --- at 256 entries the slab is 8 bytes a word, not 80 --- so the forced traversal tabulates where it once declined; whether selection should follow is an op-kind question (a read and an add against a decode and a placement), not an instruction count, and CG-16's measurement is why it does not: the win is under 2.2x where the build amortizes over n, and 40--175x losses where it does not."
honesty = "build"

# --------------------------------------------------------------------------
# The same derivation at the other pairs this workspace ships. Each section
# names its two sequences; the numbers are declarations read off the specs,
# and CM-04 recomputes them exactly as it does the AVX2 rows'. Only the codecs
# with `block > 1` are repeated --- at `block = 1` no pair has an `n`, which is
# the Grid<16> conclusion and does not move with the instruction set.
# --------------------------------------------------------------------------

# NEON: `NEON_TABLE_LANES`, four `i32` lanes to a 128-bit add, against
# `NEON_DOTPROD_I8_I32`'s sixteen products a step --- the dense tile an
# aarch64 host with the ARMv8.2-A dot-product extension runs. A NEON host
# without the extension prices the dense side at `NEON_I8_I32`'s eight and
# lands on the wasm rows' numbers. The pair is the one the measurement host
# (an Apple M4 Max) runs, and the `Book<256, 8>` row carries what it measured.

[[tabulation]]
codec = "Packed<Grid<16>, 2>"
isa = "neon"
code_space = 256
block = 2
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
note = "a nibble pair covers eight products per issued instruction at this pair, half of what one dot-product instruction covers, so no n makes it pay."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<4>, 4>"
isa = "neon"
code_space = 256
block = 4
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
note = "one table instruction covers exactly what one dot-product instruction covers at this block, so the build is never repaid --- the AVX2 row's 1025 does not transfer to this pair."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<2>, 8>"
isa = "neon"
code_space = 256
block = 8
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
break_even_n = 2049
note = "the sign tier's composition spelling at this pair. The same code space and block as E8's book, so the same break-even."
honesty = "build"

[[tabulation]]
codec = "Book<256, 8>"
isa = "neon"
code_space = 256
block = 8
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
break_even_n = 2049
note = "E8 at the pair this host runs. Measured on an Apple M4 Max (aarch64, NEON with the dot-product extension), 2026-07-29, `tabulation_breakeven`: the shipped predicate flips from the kernels to the table between n = 2048 and 2049, exactly the derived crossing --- while the clock has the table ahead from n = 512 on, so the count is the conservative claim. The timing is `open` (CG-10); the crossing is this row."
honesty = "build"

[[tabulation]]
codec = "Sign<8>"
isa = "neon"
code_space = 256
block = 8
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
break_even_n = 2049
note = "the sign tier as its own codec at this pair. The same code space and block as the Packed<Grid<2>,8> spelling, so the same break-even."
honesty = "build"

[[tabulation]]
codec = "Ternary<4>"
isa = "neon"
code_space = 256
block = 4
rows = 16
lanes_per_add = 4
kernel_products_per_step = 16
note = "the ternary tier as its own codec at this pair. The same code space and block as the Packed<Grid<4>,4> spelling, so the same conclusion: one table instruction covers exactly what one dot-product instruction covers, and no n repays the build."
honesty = "build"

# AVX-512 with VNNI: `A5_TABLE_LANES`, sixteen `i32` lanes to a 512-bit add,
# against `AVX512_DPBUSD_I8_I32`'s 64 products a step --- the densest integer
# sequence this workspace ships. Derived from the declarations and unmeasured:
# no VNNI host was available, which is what the notes below keep saying.

[[tabulation]]
codec = "Packed<Grid<16>, 2>"
isa = "avx512"
code_space = 256
block = 2
rows = 16
lanes_per_add = 16
kernel_products_per_step = 64
note = "thirty-two products per issued instruction against the dense sixty-four: no n makes it pay."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<4>, 4>"
isa = "avx512"
code_space = 256
block = 4
rows = 16
lanes_per_add = 16
kernel_products_per_step = 64
note = "one 512-bit table instruction covers exactly what one `vpdpbusd` covers at this block, so the build is never repaid. Unmeasured: no VNNI host here."
honesty = "build"

[[tabulation]]
codec = "Packed<Grid<2>, 8>"
isa = "avx512"
code_space = 256
block = 8
rows = 16
lanes_per_add = 16
kernel_products_per_step = 64
break_even_n = 2049
note = "the sign tier's composition spelling at this pair. The same code space and block as E8's book, so the same break-even. Unmeasured: no VNNI host here."
honesty = "build"

[[tabulation]]
codec = "Book<256, 8>"
isa = "avx512"
code_space = 256
block = 8
rows = 16
lanes_per_add = 16
kernel_products_per_step = 64
break_even_n = 2049
note = "E8 on a VNNI host. The AVX2 table against this dense tile is the pair that never pays --- sixty-four against sixty-four, which CM-04's gemm half asserts --- but a VNNI host's table at a sixteen-row tile is the 512-bit one, twice the density of the dense instruction, and it wins from 2049. Unmeasured: no VNNI host here. The CI x86 runner is not one either --- its lscpu line and the breakeven instrument's resolved-pair print show it declares no AVX-512 at all (avx512_available() answers from avx512f and avx512bw, and without them the last admissible table is the AVX2 one and the dense side the AVX2 tile), so the artifact's flip between 512 and 683 is the AVX2 pair's crossing, not this one's. A flip at 683 on a host that resolved the 512-bit table would be a selection defect; the resolved-pair print is what would show it."
honesty = "build"

[[tabulation]]
codec = "Sign<8>"
isa = "avx512"
code_space = 256
block = 8
rows = 16
lanes_per_add = 16
kernel_products_per_step = 64
break_even_n = 2049
note = "the sign tier as its own codec at this pair. The same code space and block as the Packed<Grid<2>,8> spelling, so the same break-even. Unmeasured: no VNNI host here."
honesty = "build"

[[tabulation]]
